name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendx_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 postgresql-client

      - name: Install Python dependencies
        working-directory: ./server
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database schema
        working-directory: ./server
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d attendx_db -f schema.sql

      - name: Run tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/attendx_db
          SECRET_KEY: test_secret_key_for_ci
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          python -m pytest tests/ -v